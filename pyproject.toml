[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "rainclass-assistant"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = ["PySide6==6.11.2", "playwright==1.62.0"]
[project.optional-dependencies]
test = ["pytest==9.2.0"]
ocr = ["rapidocr==3.10.0", "onnxruntime==1.31.1", "opencv-python-headless==4.10.0.84"]
[project.scripts]
rainclass = "rainclass.app:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
rainclass = ["mock.html", "ocr_windows.ps1"]
